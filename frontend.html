<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
      background: linear-gradient(to right, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      outline: none;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-add {
      background: var(--primary);
      color: white;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
    }

    .btn-add:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-add:active {
      transform: translateY(0);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      animation: slideIn 0.3s ease-out forwards;
    }

    li:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .task-text {
      font-size: 1.05rem;
      word-break: break-word;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0.7;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.1);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Task Manager</h1>
  
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="What needs to be done?" onkeypress="handleKeyPress(event)" />
    <button class="btn-add" onclick="addTask()">Add</button>
  </div>

  <ul id="taskList">
    <div class="empty-state">Loading tasks...</div>
  </ul>
</div>

<script>
const API = "http://127.0.0.1:8000";

async function loadTasks() {
  try {
    const res = await fetch(`${API}/tasks`);
    if (!res.ok) throw new Error('Failed to fetch tasks');
    const data = await res.json();

    const list = document.getElementById("taskList");
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = `<div class="empty-state">No tasks yet. Add one above!</div>`;
      return;
    }

    data.forEach((task, i) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <span class="task-text">${escapeHTML(task.name)}</span>
        <button class="btn-delete" onclick="deleteTask(${i})" title="Delete Task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        </button>
      `;
      list.appendChild(li);
    });
  } catch (error) {
    console.error("Error loading tasks:", error);
    const list = document.getElementById("taskList");
    list.innerHTML = `<div class="empty-state" style="color: var(--danger)">Error connecting to server.</div>`;
  }
}

async function addTask() {
  const input = document.getElementById("taskInput");
  const taskName = input.value.trim();
  
  if (!taskName) return;

  try {
    await fetch(`${API}/tasks`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name: taskName })
    });
    input.value = "";
    loadTasks();
  } catch (error) {
    console.error("Error adding task:", error);
    alert("Failed to add task. Please check if the server is running.");
  }
}

async function deleteTask(i) {
  try {
    await fetch(`${API}/tasks/${i}`, { method: "DELETE" });
    loadTasks();
  } catch (error) {
    console.error("Error deleting task:", error);
    alert("Failed to delete task.");
  }
}

function handleKeyPress(event) {
  if (event.key === 'Enter') {
    addTask();
  }
}

// Basic HTML escaping to prevent XSS
function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, 
    tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag)
  );
}

loadTasks();
</script>

</body>
</html>
